<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akmon — comparar identidades</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #9a9a9a; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header strong { margin-right: auto; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0; }
  main.solo { grid-template-columns: minmax(0, 1fr); }
  figure { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-right: 1px solid var(--line); }
  figure[hidden] { display: none; }
  figcaption { padding: 8px 12px; color: var(--muted); }
  figcaption a { color: var(--fg); }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 80vh; overflow: auto; } }
</style>
</head>
<body>
<header>
  <strong>Akmon — 3 identidades</strong>
  <div class="btns" role="group" aria-label="Mostrar">
    <button type="button" data-show="all" aria-pressed="true">As três</button>
    <button type="button" data-show="a" aria-pressed="false">A · Catálogo de Ferramentaria</button>
    <button type="button" data-show="b" aria-pressed="false">B · BBS da Forja</button>
    <button type="button" data-show="c" aria-pressed="false">C · Livro Aparafusado</button>
  </div>
  <div class="btns" role="group" aria-label="Frame">
    <button type="button" data-frame="" aria-pressed="true">Board</button>
    <button type="button" data-frame="landing-desktop" aria-pressed="false">Landing desktop</button>
    <button type="button" data-frame="landing-mobile" aria-pressed="false">Landing mobile</button>
    <a href="../../.impeccable/review/index.html" style="color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-decoration:none">Apresentação + Capturas ↗</a>
  </div>
</header>
<main id="grid">
  <figure data-id="a"><figcaption>A · Catálogo de Ferramentaria — <a href="a/index.html">abrir</a></figcaption><iframe title="Identidade A" src="a/index.html" loading="lazy"></iframe></figure>
  <figure data-id="b"><figcaption>B · BBS da Forja — <a href="b/index.html">abrir</a></figcaption><iframe title="Identidade B" src="b/index.html" loading="lazy"></iframe></figure>
  <figure data-id="c"><figcaption>C · Livro Aparafusado — <a href="c/index.html">abrir</a></figcaption><iframe title="Identidade C" src="c/index.html" loading="lazy"></iframe></figure>
</main>
<script>
  const grid = document.getElementById('grid');
  const press = (sel, btn) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  document.querySelectorAll('[data-show]').forEach(btn => btn.addEventListener('click', () => {
    const v = btn.dataset.show;
    press('[data-show]', btn);
    grid.classList.toggle('solo', v !== 'all');
    grid.querySelectorAll('figure').forEach(f => f.hidden = v !== 'all' && f.dataset.id !== v);
  }));
  document.querySelectorAll('[data-frame]').forEach(btn => btn.addEventListener('click', () => {
    press('[data-frame]', btn);
    const q = btn.dataset.frame ? `?frame=${btn.dataset.frame}` : '';
    grid.querySelectorAll('figure').forEach(f => f.querySelector('iframe').src = `${f.dataset.id}/index.html${q}`);
  }));
</script>
</body>
</html>
