<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akmon — ferreiro em ASCII</title>
<style>
  :root {
    --bg: #0a0a0a; /* = fundo que o engine pinta no canvas */
    --fg: #ece8e1;
    --muted: #8f8a82;
    --ease: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  header, footer { padding: 20px 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  header p, footer p { margin: 0; color: var(--muted); }
  main { display: grid; place-items: center; padding: 8px 16px 24px; min-height: 0; }
  .stage { width: min(100%, 720px); aspect-ratio: 635 / 984; max-height: calc(100vh - 160px); position: relative; }
  .stage canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .stage pre { display: none; margin: 0; font-size: 6px; line-height: 1.09; white-space: pre; overflow: auto; }
  .no-canvas .stage canvas { display: none; }
  .no-canvas .stage pre { display: block; }
  button {
    font: inherit; color: var(--bg); background: var(--fg); border: 0; border-radius: 999px;
    padding: 8px 16px; cursor: pointer; transition: opacity 140ms var(--ease);
  }
  button:hover { opacity: .85; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  a { color: var(--fg); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>AKMON / ferreiro.txt</h1>
  <p>Fonte: <a href="../Ferreiro%20Forjando%20uma%20L%C3%A2mina%20no%20Anvil.png">Ferreiro Forjando uma Lâmina no Anvil.png</a></p>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="art" role="img" aria-label="Ferreiro de silhueta erguendo o martelo sobre uma lâmina apoiada na bigorna, desenhado em caracteres ASCII"></canvas>
    <pre id="fallback" aria-hidden="true"></pre>
  </div>
</main>
<footer>
  <p id="status" role="status" aria-live="polite">Convertendo…</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" id="copy">Copiar texto</button>
    <button type="button" id="download">Baixar .txt</button>
  </div>
</footer>
<script type="module">
  import { asciify, imageToAsciiTextFrame, DEFAULT_OPTIONS } from 'https://esm.sh/asciify-engine@4.32.8';

  const SRC = '../Ferreiro%20Forjando%20uma%20L%C3%A2mina%20no%20Anvil.png';
  // Recorte medido na fonte (1534x1025): silhueta em x 436–1051, y 39–983, com ~20px de folga.
  const CROP = { x: 416, y: 19, w: 655, h: 984 };
  const COLS = 96; // largura do .txt (cabe no README do GitHub sem rolagem)

  const options = {
    ...DEFAULT_OPTIONS,
    charset: ' .:-=+*#%@',
    colorMode: 'grayscale',
    invert: true,          // fundo branco vira espaço; a silhueta vira os caracteres densos
    normalize: false,
    animationStyle: 'none',
    hoverStrength: 0,
    charAspect: 0.55,
  };

  const status = document.getElementById('status');
  // createImageBitmap em vez de img.decode(): decode() pode não resolver em aba em segundo plano.
  const img = await createImageBitmap(await (await fetch(SRC)).blob());

  // Recorte em canvas próprio: o mesmo recorte alimenta o desenho e o texto.
  const crop = document.createElement('canvas');
  crop.width = CROP.w; crop.height = CROP.h;
  crop.getContext('2d').drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, CROP.w, CROP.h);

  // Texto: largura fixa em colunas; altura derivada pelo charAspect do lugar onde o .txt vai ser lido.
  // charSpacing é MULTIPLICADOR da célula no código (fontSize*charSpacing), não px extras como diz o tipo: 0 = divisão por zero.
  const cell = CROP.w / COLS;
  const toText = (charAspect) => {
    const f = imageToAsciiTextFrame(crop, { ...options, fontSize: cell, charSpacing: 1, charAspect }, CROP.w, CROP.h);
    return { text: f.rows.map(r => r.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '') + '\n', cols: f.cols, rows: f.rowCount };
  };
  const terminal = toText(0.5);   // terminais: célula ~1:2
  const github = toText(0.42);    // bloco de código do GitHub: 85% da fonte, line-height 1.45
  const textFrame = terminal;
  const text = terminal.text;
  window.__akmonAscii = { text, cols: terminal.cols, rows: terminal.rows, github };
  document.getElementById('fallback').textContent = text;

  // Desenho: canvas renderizado pelo próprio engine.
  const canvas = document.getElementById('art');
  let stop;
  try {
    stop = await asciify(crop, canvas, { fontSize: 7, options: { ...options, colorMode: 'accent', accentColor: '#ece8e1', invert: true } });
    status.textContent = `.txt: ${terminal.cols}×${terminal.rows} (terminal) · ${github.cols}×${github.rows} (README)`;
  } catch (err) {
    document.documentElement.classList.add('no-canvas');
    status.textContent = 'Canvas indisponível; mostrando o texto.';
  }
  addEventListener('pagehide', () => { if (typeof stop === 'function') stop(); });

  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(text); status.textContent = 'Texto copiado.'; }
    catch { status.textContent = 'Não foi possível copiar; use Baixar .txt.'; }
  });
  document.getElementById('download').addEventListener('click', () => {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([text], { type: 'text/plain' })),
      download: 'akmon-ferreiro.txt',
    });
    a.click(); URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
